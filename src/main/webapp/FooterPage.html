<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heavy Rainfall Footer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #f0f8ff;
    }

    footer {
      position: relative;
      z-index: 1;
      height:300px !important;
      margin-inline:0px !important; 
    }

    .footer-container {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
    }

    .footer-bg {
      background: linear-gradient(to bottom, #055e7d, #03394e);
      color: white;
      font-size: 20px;
      text-shadow: 2px 2px 5px black;
    }

    .background-1 {
      background-color: rgba(116, 188, 211, 0.95);
      font-size: 18px;
    }

    .card-title {
      font-weight: bold;
      font-size: 24px;
      color: #033d4f;
    }

    .card-text {
      font-weight: bold;
      color: #001f29;
    }

    .social-icon {
      transition: transform 0.5s ease;
    }

    .social-icon:hover {
      transform: scale(1.2) rotate(5deg);
    }

    /* Realistic Rain Drop Animation */
    .raindrop {
      position: absolute;
      width: 2px;
      height: 15px;
      background: rgba(255, 255, 255, 0.7);
      animation: fall linear infinite;
      z-index: 2;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px);
        opacity: 0.5;
      }
      100% {
        transform: translateY(400px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<footer class=" conatiner-fluid card text-center mt-5 mx-3 shadow-lg footer-container">
    <!-- Footer Content -->
    <div class="card-header footer-bg">
      <marquee><b>SOME INFORMATION OF NAGVANSHI HOSPITAL</b></marquee>
    </div>
    <div class="card-body background-1">
      <h5 class="card-title">Nagvanshi Hospital</h5>
      <p class="card-text">Near Balrampur Balika Inter College Balrampur (271201) Uttar Pradesh</p>
    <p class="card-text">Contact: +91-9305667841 , 8840671505 | Email: nagvanshihospital@gmail.com</p>
    <p class="card-text">&copy; 2025 Nagvanshi Hospital | All Rights Reserved.</p>
 
      <!-- Social Media Icons -->
      <!-- Social Media Icons -->
<!-- Social Media Icons -->
<!-- Social Media Icons in Footer -->
<div style="margin-top: 10px; text-align: center;">

    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" height="50" width="50" class="rounded-circle social-icon" alt="YouTube">
  </a>

  <a href="https://www.facebook.com/profile.php?id=100054861195108" target="_blank" style="display: inline-block; vertical-align: middle; margin-left: 10px;">
    <svg xmlns="http://www.w3.org/2000/svg" height="50px" width="50px" fill="white" class="social-icon bg-primary rounded-circle" viewBox="0 0 512 512">

  <a href="tel:9305667841" style="display: inline-block; vertical-align: middle; margin-left: 10px;">

  </a>
</div>

</div>
    <!-- Heavy Rain Drops -->
</footer>

<script>

const container = document.querySelector('.footer-container');
for (let i = 0; i < 100; i++) {
  let drop = document.createElement('div');
  drop.className = 'raindrop';
  drop.style.left = Math.random() * 100 + '%';
  drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
  drop.style.animationDelay = Math.random() * 2 + 's';
  container.appendChild(drop);
}


</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
